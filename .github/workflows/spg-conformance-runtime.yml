name: SPG runtime conformance court

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/ash_a2a/spg_conformance.ex"
      - "lib/ash_a2a/gall/closure/**"
      - "priv/spg_conformance/**"
      - "test/spg_conformance_runtime_test.exs"
      - ".github/workflows/spg-conformance-runtime.yml"
  workflow_dispatch:

# A cancelled superseded PR head yields no receipt by design: only the latest
# head of a PR is admitted; main/dispatch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EKV_BUILD: "1"

jobs:
  spg-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}-
            ash-a2a-v2-mix-${{ runner.os }}-test-

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Compile (test env) for cache admission
        id: compile
        env:
          MIX_ENV: test
        run: mix compile

      - name: Format SPG court
        run: |
          mix format --check-formatted             lib/ash_a2a/spg_conformance.ex             test/spg_conformance_runtime_test.exs

      - name: Run SPG runtime conformance
        env:
          MIX_ENV: test
        run: mix test test/spg_conformance_runtime_test.exs --trace

      # Immutable-key discipline: save only a COMPLETE build (compile step succeeded),
      # even if a later step fails, under a per-run unique key so a later good run
      # can save again; never after cancel or a failed compile (no partial cache).
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}-${{ github.run_id }}
