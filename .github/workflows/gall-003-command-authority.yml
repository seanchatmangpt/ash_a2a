name: GALL-003 Command Authority Court

on:
  push:
    branches:
      - main
    paths:
      - "lib/ash_a2a/command_bus.ex"
      - "lib/ash_a2a/gall/**"
      - "lib/ash_a2a/receipt*.ex"
      - "lib/ash_a2a/semantic/refusal.ex"
      - "lib/ash_a2a/semantic_projection.ex"
      - "test/ash_a2a_gall_command_authority_test.exs"
      - "test/ash_a2a_gall_process_autonomics_test.exs"
      - "test/gall_checkpoint_003_command_authority_chicago_test.exs"
      - "test/ash_a2a/semantic_refusal_test.exs"
      - ".github/workflows/gall-003-command-authority.yml"
  pull_request:
    paths:
      - "lib/ash_a2a/command_bus.ex"
      - "lib/ash_a2a/gall/**"
      - "lib/ash_a2a/receipt*.ex"
      - "lib/ash_a2a/semantic/refusal.ex"
      - "lib/ash_a2a/semantic_projection.ex"
      - "test/ash_a2a_gall_command_authority_test.exs"
      - "test/ash_a2a_gall_process_autonomics_test.exs"
      - "test/gall_checkpoint_003_command_authority_chicago_test.exs"
      - "test/ash_a2a/semantic_refusal_test.exs"
      - ".github/workflows/gall-003-command-authority.yml"
  workflow_dispatch:

# A cancelled superseded PR head yields no receipt by design: only the latest
# head of a PR is admitted; main/dispatch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Deliberate ekv source build (SC-03): ekv 0.4.3 ships no 0.4.3 checksums.
  EKV_BUILD: "1"

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}-
            ash-a2a-v2-mix-${{ runner.os }}-test-
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
        env:
          MIX_ENV: test
      - id: compile
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      # Immutable-key discipline: save only a COMPLETE build (compile step succeeded),
      # even if a later step fails, under a per-run unique key so a later good run
      # can save again; never after cancel or a failed compile (no partial cache).
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}-${{ github.run_id }}
      - name: GALL-003 focused court
        env:
          MIX_ENV: test
        # `mix test` is aliased to `test --exclude serial`; the GALL court files are
        # @moduletag :serial, so plain `mix test` runs 0 tests. `test.all` includes them.
        run: |
          mix test.all \
            test/ash_a2a/semantic_refusal_test.exs \
            test/ash_a2a_gall_command_authority_test.exs \
            test/ash_a2a_gall_process_autonomics_test.exs \
            test/gall_checkpoint_003_command_authority_chicago_test.exs
