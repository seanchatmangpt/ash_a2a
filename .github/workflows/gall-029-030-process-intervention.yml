name: GALL-029-030 process intervention court

on:
  pull_request:
    branches:
      - gall/v26.9.18-final-specs
    paths:
      - "lib/ash_a2a/gall/process_intervention.ex"
      - "lib/ash_a2a/command.ex"
      - "test/gall_process_intervention_test.exs"
      - ".github/workflows/gall-029-030-process-intervention.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Deliberate ekv source build (SC-03): ekv 0.4.3 ships no 0.4.3 checksums.
  EKV_BUILD: "1"

jobs:
  process-intervention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Format changed court
        run: |
          mix format --check-formatted \
            lib/ash_a2a/gall/process_intervention.ex \
            lib/ash_a2a/command.ex \
            test/gall_process_intervention_test.exs

      - name: Run GALL-029-030 narrow court
        env:
          MIX_ENV: test
        run: mix test test/gall_process_intervention_test.exs --trace
