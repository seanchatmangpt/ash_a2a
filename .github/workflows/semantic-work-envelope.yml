name: Semantic Work Envelope Court

on:
  pull_request:
    branches:
      - feat/v26.9.18-semantic-work-fabric
    paths:
      - "lib/ash_a2a/semantic/work_envelope.ex"
      - "test/ash_a2a_semantic_work_envelope_test.exs"
      - ".github/workflows/semantic-work-envelope.yml"
  workflow_dispatch:

# A cancelled superseded PR head yields no receipt by design: only the latest
# head of a PR is admitted; main/dispatch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Deliberate ekv source build (SC-03): ekv 0.4.3 ships no 0.4.3 checksums.
  EKV_BUILD: "1"

jobs:
  exact-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}-
            ash-a2a-v2-mix-${{ runner.os }}-test-
      - run: mix deps.get --check-locked
      - name: Compile (test env) for cache admission
        id: compile
        env:
          MIX_ENV: test
        run: mix compile
      - name: Format only the semantic-work subject
        run: mix format --check-formatted lib/ash_a2a/semantic/work_envelope.ex test/ash_a2a_semantic_work_envelope_test.exs
      - name: Execute exact semantic-work envelope court
        run: mix test test/ash_a2a_semantic_work_envelope_test.exs
      # Immutable-key discipline: save only a COMPLETE build (compile step succeeded),
      # even if a later step fails, under a per-run unique key so a later good run
      # can save again; never after cancel or a failed compile (no partial cache).
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}-${{ github.run_id }}
