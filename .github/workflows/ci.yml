name: CI

on:
  push:
    branches: [main]
  pull_request:

# Shape: `supply-chain` (fast) + `lane` x4 (the suite split along the repo's own
# documented, measured seams) -> `test` (merged coverage, threshold-gated; keeps
# the required check name). `conformance` (A2A v1.0 court report, artifact +
# totals.fail gate) and `docs` (ex_doc build) run in parallel as the CI half of
# the `mix check` gap (G3); both are explicitly non-gating while the honest
# staging ledger in `.check.exs` marks them not-yet-green on this tree.
# Rust advisories/licenses and the package-closure check live in
# supply-chain-deep.yml (lock-touching PRs + weekly), so a newly published
# advisory cannot turn unrelated PRs red.
#
# A cancelled superseded PR head yields no receipt by design: only the latest
# head of a PR is admitted; main/dispatch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at workflow scope; no job here writes to the repository.
permissions:
  contents: read

env:
  # ekv 0.4.3's checksum.exs lists only 0.3.0 precompiled artifacts, so a
  # non-dev/test build fails the checksum lookup and falls back to a source
  # build by accident. Choose the source build deliberately (SC-03).
  EKV_BUILD: "1"

jobs:
  # Supply-chain gate (SC-02): lock drift, Hex advisories and Rust
  # advisories/bans/licenses/sources for both crates. Fails closed on every PR;
  # cheap because cargo-deny is a release binary (seconds), not a source build.
  # The heavier package-closure check lives in supply-chain-deep.yml.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Refuse mix.lock drift
        run: mix deps.get --check-locked
      - name: Refuse retired / security-advisory Hex packages
        run: mix hex.audit
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # Official maintainer release binary (was: `cargo install`, compiled from
      # source every run). Version + SHA-256 pinned; the digest was taken from
      # the downloaded 0.20.2 musl release asset (trust-on-first-use).
      - name: Install cargo-deny (release binary)
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          asset="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${asset}.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${asset}/cargo-deny" /usr/local/bin/cargo-deny
      - name: cargo-deny (hddl_cli)
        run: >-
          cargo deny --manifest-path native/hddl_cli/Cargo.toml
          --config .github/cargo-deny.toml --locked
          check advisories bans licenses sources
      - name: cargo-deny (graphlaw_host)
        run: >-
          cargo deny --manifest-path native/graphlaw_host/Cargo.toml
          --config .github/cargo-deny.toml --locked
          check advisories bans licenses sources

  # Security gate (sobelow). hex.audit is already gated in `supply-chain`
  # above (and release.yml), so this job owns the static-analysis half only:
  # `mix sobelow --exit high` -- the same threshold `.check.exs` gates locally
  # (line 100: {:sobelow, [["mix", "sobelow", "--exit", "high"]]}). Sobelow is
  # a dev-only dep (mix.exs:507, only: :dev), so this runs in MIX_ENV=dev with
  # the same dev cache shape as the `docs` job below. No Postgres needed:
  # sobelow is static analysis over lib/.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-dev-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-a2a-v2-dev-${{ runner.os }}-
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Verify mix.lock unchanged
        run: git diff --exit-code -- mix.lock
      - name: Sobelow static analysis (fail on high-confidence findings)
        run: mix sobelow --exit high

  # TCK in CI: REFUSED(ci:tck-not-in-tree) -- the official a2aproject/a2a-tck
  # suite is an external repo at a moving `main` ref, and the SUT it ran
  # against (tck_sut.exs, per docs/reference/a2a-v1-conformance.md) is
  # session-ephemeral (/tmp/z19/...), not in this tree. A dispatch-only job
  # would reference an artifact that does not exist on any checkout. Land the
  # SUT in-tree first, then promote to a scheduled/dispatch job.

  # The suite, split along the seams mix.exs already documents: the async fast
  # lane, the `:serial_solo` files (host-level shared resources: fixed ports,
  # :peer, shared Postgres, native subprocess -- never sharded), and the
  # `:serial_shard` files (VM-local shared state -- safe as N OS processes).
  # Each lane is its own runner with its own Postgres service, so no
  # cross-lane resource can collide. Setup is ~1 min warm; tests dominate.
  lane:
    name: lane (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # one push should reveal every red lane, not the first
      matrix:
        # Balanced from measured test times (4a647a9): fast 2.1 min, solo
        # 5.0 min, shard-1 1.5 min, shard-2 4.3 min, shard-3 4.4 min.
        include:
          - { name: quick, dbs: "1", format: "true", save: "true" } # fast + shard-1
          - { name: solo }
          - { name: shard-2, dbs: "2" }
          - { name: shard-3, dbs: "3" }
    env:
      MIX_ENV: test
    # Real PostgreSQL for AshA2A.Test.Repo (config/test.exs); credentials and
    # host port 55432 match it exactly. config/test.exs names the database
    # `ash_a2a_test<MIX_TEST_PARTITION>`; shard lanes create theirs below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build
        with:
          format: ${{ matrix.format || 'false' }}
          save-cache: ${{ matrix.save || 'false' }}
      - name: Create partition database
        if: ${{ matrix.dbs }}
        env:
          MIX_TEST_PARTITION: ${{ matrix.dbs }}
        run: mix ecto.create
      # TQ-09: each lane exports coverage; the threshold is evaluated once, on
      # the merged data, by the `test` job (`--export-coverage` alone never
      # evaluates it).
      - name: Fast async lane
        if: ${{ matrix.name == 'quick' }}
        run: mix test --cover --export-coverage fast
      - name: Serial shard 1 of 3
        if: ${{ !cancelled() && matrix.name == 'quick' }}
        env:
          MIX_TEST_PARTITION: "1"
        run: mix test.serial.shard --partitions 3 --cover --export-coverage shard-1
      # `:serial_solo` (~23 files) holds host-level shared resources (fixed
      # ports, :peer, shared Postgres, native subprocess): it runs alone.
      - name: Serial solo lane
        if: ${{ matrix.name == 'solo' }}
        run: mix test.serial.solo --cover --export-coverage solo
      - name: Serial shard (${{ matrix.name }})
        if: ${{ startsWith(matrix.name, 'shard-') }}
        env:
          MIX_TEST_PARTITION: ${{ matrix.dbs }}
        run: mix test.serial.shard --partitions 3 --cover --export-coverage ${{ matrix.name }}
      # Uploaded even when a test failed: Mix exports coverage regardless, and
      # the `test` job merges whatever exists so the merge path is exercised and
      # a coverage number is reported on every run, not only fully-green ones.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverdata-${{ matrix.name }}
          path: cover/*.coverdata
          retention-days: 1
          if-no-files-found: warn

  # The required check `test`: green only if every lane succeeded AND the
  # merged coverage meets the mix.exs floor. One job instead of a separate
  # coverage job plus an aggregate -- each extra stage costs a queue wait.
  # The merge runs whatever the lanes did (so it is exercised on every run);
  # the lane verdict is asserted last and can still fail the job.
  test:
    needs: lane
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverdata-*
          merge-multiple: true
          path: cover
      - run: mix test.coverage
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: cover/
          if-no-files-found: warn
      - name: Require every lane to have succeeded
        if: ${{ always() }}
        env:
          LANE: ${{ needs.lane.result }}
        run: |
          echo "lane=$LANE"
          test "$LANE" = success

  # Lane CI-1 (G3, CI half of the `mix check` gap): the A2A v1.0 conformance
  # court report. One command runs every pinned v1.0 court as a REAL OS
  # subprocess (lib/mix/tasks/ash_a2a.v1_conformance_report.ex, 25-court
  # @v1_courts list) and writes one machine-readable JSON verdict; the task
  # always exits 0, so the gate is the JSON itself: totals.fail == 0.
  #
  # Non-gating on purpose, not silently: `.check.exs`' honest-staging ledger
  # (measured 2026-10-04) records this stage "WIRED, not yet run to completion
  # here". TODO(ci-g3): drop `continue-on-error` the moment a run witnesses
  # totals.fail == 0 on main -- same promotion rule as the .check.exs ledger.
  # The report is uploaded even on failure so the FAIL is durable evidence.
  conformance:
    name: conformance (v1 court report)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true # see TODO(ci-g3) above; promotion = witnessed green
    env:
      MIX_ENV: test
    # Real PostgreSQL, identical to the `lane` job: several v1 courts run the
    # suite's own test config (ash_a2a_test on host port 55432).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Same toolchain pin (.tool-versions), same deps, same compile gate as
      # every lane: the courts run against the same admitted build.
      - uses: ./.github/actions/build
      - name: A2A v1.0 conformance court report (real subprocess per court)
        run: mix ash_a2a.v1_conformance_report --out v1-conformance.json
      - name: Gate on the report's own documented gate (totals.fail == 0)
        run: jq -e '.totals.fail == 0' v1-conformance.json > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: v1-conformance-${{ github.event.pull_request.head.sha || github.sha }}
          path: v1-conformance.json
          retention-days: 7
          if-no-files-found: error

  # Docs gate (G3): `mix docs` so doc breakage (bad extras list, broken
  # doc references) is caught in CI. Known-red today, per the same ledger:
  # "docs RED -- ExDoc.Extras.build/2 raises on the current extras list
  # (mix.exs docs/0); ownership: mix.exs docs config". Included, not hidden.
  # TODO(ci-g3): fix the extras list in mix.exs docs/0, then drop
  # `continue-on-error` -- the ledger is the tracker item.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true # TODO(ci-g3) above; see .check.exs docs RED entry
    env:
      MIX_ENV: dev # ex_doc is `only: :dev` (mix.exs); docs build in dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      # Dev-env cache, keyed on the real invalidators only (no Rust, no child
      # projects: ex_doc needs neither).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-docs-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-a2a-v2-docs-${{ runner.os }}-
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Verify mix.lock unchanged
        run: git diff --exit-code -- mix.lock
      - run: mix docs
