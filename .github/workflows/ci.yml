name: CI

on:
  push:
    branches: [main]
  pull_request:

# A cancelled superseded PR head yields no receipt by design: only the latest
# head of a PR is admitted; main/dispatch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at workflow scope; no job here writes to the repository.
permissions:
  contents: read

env:
  # ekv 0.4.3's checksum.exs lists only 0.3.0 precompiled artifacts, so a
  # non-dev/test build fails the checksum lookup and falls back to a source
  # build by accident. Choose the source build deliberately (SC-03).
  EKV_BUILD: "1"

jobs:
  # Supply-chain gate (SC-02): dependency advisories, lock drift and Rust
  # advisories/licenses/sources. Fails closed; runs in parallel with `test`.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Refuse mix.lock drift
        run: mix deps.get --check-locked
      - name: Refuse retired / security-advisory Hex packages
        run: mix hex.audit
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install cargo-deny
        run: cargo +1.97.1 install cargo-deny --locked --version 0.20.2
      - name: cargo-deny (hddl_cli)
        run: >-
          cargo deny --manifest-path native/hddl_cli/Cargo.toml
          --config .github/cargo-deny.toml --locked
          check advisories bans licenses sources
      - name: cargo-deny (graphlaw_host)
        run: >-
          cargo deny --manifest-path native/graphlaw_host/Cargo.toml
          --config .github/cargo-deny.toml --locked
          check advisories bans licenses sources
      # SC-10: lib/ reads native/*/Cargo.toml; the Hex tarball must carry the
      # exact native sources the composition lock pins, or consumers resolve
      # to missing files.
      - name: Package closure carries the native sources lib/ references
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/pkg"
          mix hex.build --unpack -o "$pkg"
          for crate in hddl_cli graphlaw_host; do
            for f in Cargo.toml Cargo.lock rust-toolchain.toml src/main.rs; do
              test -f "$pkg/native/$crate/$f" || { echo "REFUSED(package:missing native/$crate/$f)" >&2; exit 2; }
            done
            test ! -e "$pkg/native/$crate/target" || { echo "REFUSED(package:ships native/$crate/target)" >&2; exit 2; }
          done
          mix run --no-start -e '
            lock = AshA2A.Chicago.Release.CompositionLock.build!(repo: System.fetch_env!("PKG"))
            if Enum.any?(Map.values(lock.native_pins), &is_nil/1), do: System.halt(2)
            IO.inspect(lock.native_pins, label: "unpacked native_pins")'
        env:
          PKG: ${{ runner.temp }}/pkg
          # test env: avoids compiling the dev-only ggen_igniter Rustler tree.
          MIX_ENV: test

  test:
    runs-on: ubuntu-latest
    env:
      # test env: one compile, and skips the dev-only ggen_igniter Rustler
      # build (no lib/ branch reads Mix.env() == :dev). Same env as the
      # court workflows so the _build cache is shared.
      MIX_ENV: test
    # Real PostgreSQL for AshA2A.Test.Repo (config/test.exs) --
    # test/ash_a2a/oban_delivery_qualification_test.exs (GAP D real Oban
    # integration) needs a real, reachable Postgres to create and query
    # Oban's real `oban_jobs` table against; its own setup_all raises a
    # clear diagnostic (rather than failing opaquely) when none is
    # reachable, which is exactly what a hosted-CI run without this
    # service produced: 0 failures, 4 invalid ("failure on setup_all
    # callback, all tests have been invalidated"), exit code 2. Host port
    # 55432 and the postgres/postgres/ash_a2a_test credentials match
    # config/test.exs's `AshA2A.Test.Repo` config exactly -- the same
    # values this repo's own local development Postgres container uses.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      # One toolchain identity everywhere (SC-09): .tool-versions is the pin.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
            native/hddl_cli/target
            native/graphlaw_host/target
          key: ash-a2a-v2-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'native/hddl_cli/Cargo.lock', 'native/graphlaw_host/Cargo.lock') }}
          restore-keys: |
            ash-a2a-v2-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'native/hddl_cli/Cargo.lock', 'native/graphlaw_host/Cargo.lock') }}-
            ash-a2a-v2-${{ runner.os }}-test-
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build exact ferroplan-backed HDDL CLI
        run: cargo +1.97.1 build --manifest-path native/hddl_cli/Cargo.toml --release --locked
      - name: Build graphlaw_host (wasmtime runtime B)
        run: cargo +1.97.1 build --manifest-path native/graphlaw_host/Cargo.toml --release --locked
      - name: Preserve Cargo lock candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hddl-cli-cargo-lock
          path: native/hddl_cli/Cargo.lock
          if-no-files-found: error
      - name: Verify Cargo locks are tracked and current
        run: |
          git ls-files --error-unmatch native/hddl_cli/Cargo.lock native/graphlaw_host/Cargo.lock
          git diff --exit-code -- native/hddl_cli/Cargo.lock native/graphlaw_host/Cargo.lock
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      # test-env deps.get skips dev-only deps: fail if it had to rewrite the lock.
      - name: Verify mix.lock unchanged
        run: git diff --exit-code -- mix.lock
      - run: mix format --check-formatted
      - id: compile
        run: mix compile --warnings-as-errors
      # Immutable-key discipline: save only a COMPLETE build (compile step succeeded),
      # even if a later step fails, under a per-run unique key so a later good run
      # can save again; never after cancel or a failed compile (no partial cache).
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        with:
          path: |
            deps
            _build
            native/hddl_cli/target
            native/graphlaw_host/target
          key: ash-a2a-v2-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'native/hddl_cli/Cargo.lock', 'native/graphlaw_host/Cargo.lock') }}-${{ github.run_id }}
      # TQ-09: coverage is measured and gated (threshold in mix.exs
      # test_coverage/0). Plain `--cover` is required: with
      # `--export-coverage` Mix only writes .coverdata and never evaluates the
      # threshold (witnessed: exit 0 at 33% under a 99% floor), so the gate
      # would be vacuous. The HTML report in cover/ is kept as evidence.
      - run: mix test.all --cover
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: cover/
          if-no-files-found: warn
