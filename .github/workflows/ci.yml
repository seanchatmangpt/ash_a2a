name: CI

on:
  push:
    branches: [main]
  pull_request:

# 80/20 shape: `supply-chain` (fast: lock drift + Hex advisories) and `test`
# (format -> compile -> tests, cheap checks first) gate every PR. Rust
# advisories/licenses and the package-closure check live in
# supply-chain-deep.yml (lock-touching PRs + weekly), so a newly published
# advisory cannot turn unrelated PRs red.
#
# A cancelled superseded PR head yields no receipt by design: only the latest
# head of a PR is admitted; main/dispatch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at workflow scope; no job here writes to the repository.
permissions:
  contents: read

env:
  # ekv 0.4.3's checksum.exs lists only 0.3.0 precompiled artifacts, so a
  # non-dev/test build fails the checksum lookup and falls back to a source
  # build by accident. Choose the source build deliberately (SC-03).
  EKV_BUILD: "1"

jobs:
  # Fast supply-chain gate (SC-02): lock drift and retired / advisory Hex
  # packages. Rust checks: see supply-chain-deep.yml.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Refuse mix.lock drift
        run: mix deps.get --check-locked
      - name: Refuse retired / security-advisory Hex packages
        run: mix hex.audit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # test env: one compile, and skips the dev-only ggen_igniter Rustler
      # build (no lib/ branch reads Mix.env() == :dev).
      MIX_ENV: test
    # Real PostgreSQL for AshA2A.Test.Repo (config/test.exs); credentials and
    # host port 55432 match it exactly. Without it the Oban qualification
    # tests are invalidated in setup_all.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      # One toolchain identity everywhere (SC-09): .tool-versions is the pin.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
            native/hddl_cli/target
            native/graphlaw_host/target
          key: ash-a2a-v2-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'native/hddl_cli/Cargo.lock', 'native/graphlaw_host/Cargo.lock') }}
          restore-keys: |
            ash-a2a-v2-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'native/hddl_cli/Cargo.lock', 'native/graphlaw_host/Cargo.lock') }}-
            ash-a2a-v2-${{ runner.os }}-test-
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      # test-env deps.get skips dev-only deps: fail if it had to rewrite the lock.
      - name: Verify mix.lock unchanged
        run: git diff --exit-code -- mix.lock
      # Cheapest check first: fail in seconds, before any Rust or BEAM build.
      - run: mix format --check-formatted
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build exact ferroplan-backed HDDL CLI
        run: cargo +1.97.1 build --manifest-path native/hddl_cli/Cargo.toml --release --locked
      - name: Build graphlaw_host (wasmtime runtime B)
        run: cargo +1.97.1 build --manifest-path native/graphlaw_host/Cargo.toml --release --locked
      - name: Verify Cargo locks are tracked and current
        run: |
          git ls-files --error-unmatch native/hddl_cli/Cargo.lock native/graphlaw_host/Cargo.lock
          git diff --exit-code -- native/hddl_cli/Cargo.lock native/graphlaw_host/Cargo.lock
      - id: compile
        run: mix compile --warnings-as-errors
      # Immutable-key discipline: save only a COMPLETE build (compile succeeded),
      # under a per-run unique key; never after cancel or a failed compile.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        with:
          path: |
            deps
            _build
            native/hddl_cli/target
            native/graphlaw_host/target
          key: ash-a2a-v2-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'native/hddl_cli/Cargo.lock', 'native/graphlaw_host/Cargo.lock') }}-${{ github.run_id }}
      # TQ-09: coverage is gated by the threshold in mix.exs test_coverage/0.
      # Plain `--cover` is required: `--export-coverage` never evaluates it.
      - run: mix test.all --cover
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: cover/
          if-no-files-found: warn
