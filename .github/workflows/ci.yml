name: CI

on:
  push:
    branches: [main]
  pull_request:

# Shape: `supply-chain` (fast) + `lane` x5 (the suite split along the repo's own
# documented, measured seams) -> `coverage` (merged, threshold-gated) -> `test`
# (aggregate; keeps the required check name). Rust
# advisories/licenses and the package-closure check live in
# supply-chain-deep.yml (lock-touching PRs + weekly), so a newly published
# advisory cannot turn unrelated PRs red.
#
# A cancelled superseded PR head yields no receipt by design: only the latest
# head of a PR is admitted; main/dispatch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at workflow scope; no job here writes to the repository.
permissions:
  contents: read

env:
  # ekv 0.4.3's checksum.exs lists only 0.3.0 precompiled artifacts, so a
  # non-dev/test build fails the checksum lookup and falls back to a source
  # build by accident. Choose the source build deliberately (SC-03).
  EKV_BUILD: "1"

jobs:
  # Fast supply-chain gate (SC-02): lock drift and retired / advisory Hex
  # packages. Rust checks: see supply-chain-deep.yml.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Refuse mix.lock drift
        run: mix deps.get --check-locked
      - name: Refuse retired / security-advisory Hex packages
        run: mix hex.audit

  # The suite, split along the seams mix.exs already documents: the async fast
  # lane, the `:serial_solo` files (host-level shared resources: fixed ports,
  # :peer, shared Postgres, native subprocess -- never sharded), and the
  # `:serial_shard` files (VM-local shared state -- safe as N OS processes).
  # Each lane is its own runner with its own Postgres service, so no
  # cross-lane resource can collide. Setup is ~1 min warm; tests dominate.
  lane:
    name: lane (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # one push should reveal every red lane, not the first
      matrix:
        include:
          - { name: fast, cmd: "mix test", format: "true", save: "true" }
          - { name: solo, cmd: "mix test.serial.solo" }
          - { name: shard-1, cmd: "mix test.serial.shard --partitions 3", partition: "1" }
          - { name: shard-2, cmd: "mix test.serial.shard --partitions 3", partition: "2" }
          - { name: shard-3, cmd: "mix test.serial.shard --partitions 3", partition: "3" }
    env:
      MIX_ENV: test
    # Real PostgreSQL for AshA2A.Test.Repo (config/test.exs); credentials and
    # host port 55432 match it exactly. config/test.exs names the database
    # `ash_a2a_test<MIX_TEST_PARTITION>`; shard lanes create theirs below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build
        with:
          format: ${{ matrix.format || 'false' }}
          save-cache: ${{ matrix.save || 'false' }}
      - name: Create partition database
        if: ${{ matrix.partition }}
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: mix ecto.create
      # TQ-09: each lane exports coverage; the threshold is evaluated once, on
      # the merged data, by the `coverage` job (`--export-coverage` alone never
      # evaluates it).
      - name: Run lane
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: ${{ matrix.cmd }} --cover --export-coverage ${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverdata-${{ matrix.name }}
          path: cover/*.coverdata
          retention-days: 1
          if-no-files-found: error

  # Merge every lane's coverdata and evaluate the mix.exs coverage floor.
  coverage:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverdata-*
          merge-multiple: true
          path: cover
      - run: mix test.coverage
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: cover/
          if-no-files-found: warn

  # Aggregate, keeping the required check name `test`: green only if every
  # lane and the coverage gate succeeded (skipped/cancelled count as red).
  test:
    needs: [lane, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LANE: ${{ needs.lane.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          echo "lane=$LANE coverage=$COVERAGE"
          test "$LANE" = success && test "$COVERAGE" = success
