name: CI

on:
  push:
    branches: [main]
  pull_request:

# Shape: `supply-chain` (fast) + `lane` x4 (the suite split along the repo's own
# documented, measured seams) -> `test` (merged coverage, threshold-gated; keeps
# the required check name). `conformance` (A2A v1.0 court report, artifact +
# totals.fail gate) and `docs` (ex_doc build) run in parallel as the CI half of
# the `mix check` gap (G3); both are explicitly non-gating while the honest
# staging ledger in `.check.exs` marks them not-yet-green on this tree.
# Rust advisories/licenses and the package-closure check live in
# supply-chain-deep.yml (lock-touching PRs + weekly), so a newly published
# advisory cannot turn unrelated PRs red.
#
# Mutation court (`mix muzak.sec`, config in .muzak.exs, Elixir-1.19 shims in
# .muzak/) is NOT a per-PR stage: a full run is hours (each mutant restarts
# the whole suite), so it is nightly-tier — schedule it separately, e.g.
#   cron: "0 7 * * *"  ->  MUZAK_TEST_PATHS=test/ash_a2a/protocol/plug MIX_ENV=test mix muzak.sec
# (documented in docs/how-to/run-mutation-testing.md).
#
# A cancelled superseded PR head yields no receipt by design: only the latest
# head of a PR is admitted; main/dispatch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at workflow scope; no job here writes to the repository.
permissions:
  contents: read

env:
  # ekv 0.4.3's checksum.exs lists only 0.3.0 precompiled artifacts, so a
  # non-dev/test build fails the checksum lookup and falls back to a source
  # build by accident. Choose the source build deliberately (SC-03).
  EKV_BUILD: "1"

jobs:
  # Supply-chain gate (SC-02): lock drift, Hex advisories and Rust
  # advisories/bans/licenses/sources for both crates. Fails closed on every PR;
  # cheap because cargo-deny is a release binary (seconds), not a source build.
  # The heavier package-closure check lives in supply-chain-deep.yml.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Refuse mix.lock drift
        run: mix deps.get --check-locked
      - name: Refuse unused locked deps
        run: mix deps.unlock --check-unused
      - name: Refuse retired / security-advisory Hex packages
        run: mix hex.audit
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # Official maintainer release binary (was: `cargo install`, compiled from
      # source every run). Version + SHA-256 pinned; the digest was taken from
      # the downloaded 0.20.2 musl release asset (trust-on-first-use).
      - name: Install cargo-deny (release binary)
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          asset="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${asset}.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${asset}/cargo-deny" /usr/local/bin/cargo-deny
      - name: cargo-deny (hddl_cli)
        run: >-
          cargo deny --manifest-path native/hddl_cli/Cargo.toml
          --config .github/cargo-deny.toml --locked
          check advisories bans licenses sources
      - name: cargo-deny (graphlaw_host)
        run: >-
          cargo deny --manifest-path native/graphlaw_host/Cargo.toml
          --config .github/cargo-deny.toml --locked
          check advisories bans licenses sources

  # Security gate (sobelow). hex.audit is already gated in `supply-chain`
  # above (and release.yml), so this job owns the static-analysis half only:
  # `mix sobelow --exit high` -- the same threshold `.check.exs` gates locally
  # (line 100: {:sobelow, [["mix", "sobelow", "--exit", "high"]]}). Sobelow is
  # a dev-only dep (mix.exs:507, only: :dev), so this runs in MIX_ENV=dev with
  # the same dev cache shape as the `docs` job below. No Postgres needed:
  # sobelow is static analysis over lib/.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-dev-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-a2a-v2-dev-${{ runner.os }}-
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Verify mix.lock unchanged
        run: git diff --exit-code -- mix.lock
      - name: Refuse unused locked deps
        run: mix deps.unlock --check-unused
      - name: Sobelow static analysis (fail on high-confidence findings)
        run: mix sobelow --exit high

  # TCK in CI (promotes the former REFUSED(ci:tck-not-in-tree)): the official
  # a2aproject/a2a-tck suite runs against the in-tree SUT harness
  # (tck_sut.exs) over a real Bandit listener on 127.0.0.1:9999. The TCK is
  # cloned SHALLOW at a full-SHA pin (moving `main` is not an admission
  # surface) and results are gated on the FAILED count in compatibility.json,
  # not on the runner's own exit code. See docs/reference/a2a-v1-conformance.md.
  tck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Single source of the TCK pin; docs/reference/tck-suite.md cites it
      # (court: test/tck_assert_script_test.exs).
      TCK_PIN_SHA: 104a7b4ae0d83f65c075e3793e322953a830eaba
      # tck_sut.exs binds HTTP on TCK_SUT_PORT and gRPC on TCK_SUT_GRPC_PORT;
      # explicit so a host service on 10000 (local Docker Azurite) is a visible
      # override, never a silent port collision.
      TCK_SUT_PORT: "9999"
      TCK_SUT_GRPC_PORT: "10000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Compile test deps for the SUT
        run: mix compile
        env:
          MIX_ENV: test
      - name: Start SUT (background)
        run: |
          mix run --no-start tck_sut.exs > /tmp/tck_sut.log 2>&1 &
          echo "SUT_PID=$!" >> "$GITHUB_ENV"
        env:
          MIX_ENV: test
      - name: Wait for SUT on :9999
        run: |
          n=0
          until curl -fsS -o /dev/null http://127.0.0.1:9999/.well-known/agent-card.json; do
            n=$((n+1))
            if [ "$n" -ge 60 ]; then
              echo "SUT did not come up"; cat /tmp/tck_sut.log; exit 1
            fi
            sleep 2
          done
          echo "SUT up after ${n} attempts"
      - name: Clone TCK at pinned SHA
        run: |
          git clone https://github.com/a2aproject/a2a-tck.git /tmp/a2a-tck
          cd /tmp/a2a-tck && git checkout "$TCK_PIN_SHA"
      # The TCK at this pin requires Python >= 3.15 (pyproject requires-python).
      # uv (installed with pip from the already-pinned setup-python above, so no
      # extra third-party action) downloads the 3.15 interpreter itself and
      # builds the venv this lane was verified in; the pinned layout installs
      # via pyproject (no pip requirements file).
      - name: Install TCK (Python 3.15 via uv)
        run: |
          pip install uv==0.11.32
          cd /tmp/a2a-tck
          uv venv --python 3.15 /tmp/tck_venv
          VIRTUAL_ENV=/tmp/tck_venv uv pip install -e .
      - name: Run TCK suite
        run: |
          cd /tmp/a2a-tck
          source /tmp/tck_venv/bin/activate
          # run_tck.py exits 1 on the documented expected failure; keep going so the
          # exit code is recorded and the assert step below judges it (bash -e -o pipefail).
          set +e
          ./run_tck.py --sut-host http://127.0.0.1:9999 \
            --transport jsonrpc,http_json,grpc | tee /tmp/tck-run.log
          echo "TCK_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
        shell: bash
      - name: Assert zero failed MUST requirements
        run: |
          # Only ids in scripts/tck_expected_failures.json (and only on the TCK
          # commits they name) are tolerated; an unlisted failure or a listed
          # id that starts passing fails the job (pipefail via shell: bash).
          python3 scripts/tck_assert.py /tmp/a2a-tck/reports/compatibility.json \
            --expected-failures scripts/tck_expected_failures.json \
            --tck-sha "$TCK_PIN_SHA" | tee /tmp/tck-assert.log
          # run_tck.py exits 1 on any failed requirement: accepted only when
          # the assert above passed AND matched at least one expected failure.
          if [ "${TCK_EXIT:-0}" != "0" ]; then
            if [ "${TCK_EXIT}" = "1" ] && ! grep -q ' expected_fail=0 ' /tmp/tck-assert.log; then
              echo "run_tck.py exited 1 only for expected failures (scripts/tck_expected_failures.json)"
            else
              echo "run_tck.py exited ${TCK_EXIT} (assert passed; see /tmp/tck-run.log)"
              exit 1
            fi
          fi
        shell: bash
      - name: Stop SUT
        if: always()
        run: kill "$SUT_PID" 2>/dev/null || true

  # External A2A v1.1.0-rc protobuf/gRPC oracle (test/support/a2a_v1_1_oracle):
  # an independent Python protobuf/gRPC process validates the in-tree
  # ByteServer's wire bytes (agent card, JSON-RPC, HTTP+JSON, gRPC over real
  # TCP). The court test shells out to `uv run --with grpcio ...`, so uv must
  # be on PATH.
  oracle:
    name: oracle (external v1.1 protobuf/gRPC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.32
      - uses: ./.github/actions/build
      - name: External v1.1 oracle court
        run: mix test test/ash_a2a_byte_server_conformance_test.exs --include serial

  # The suite, split along the seams mix.exs already documents: the async fast
  # lane, the `:serial_solo` files (host-level shared resources: fixed ports,
  # :peer, shared Postgres, native subprocess -- never sharded), and the
  # `:serial_shard` files (VM-local shared state -- safe as N OS processes).
  # Each lane is its own runner with its own Postgres service, so no
  # cross-lane resource can collide. Setup is ~1 min warm; tests dominate.
  lane:
    name: lane (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # one push should reveal every red lane, not the first
      matrix:
        # Balanced from measured test times (4a647a9): fast 2.1 min, solo
        # 5.0 min, shard-1 1.5 min, shard-2 4.3 min, shard-3 4.4 min.
        include:
          - { name: quick, dbs: "1", format: "true", save: "true" } # fast + shard-1
          - { name: solo }
          - { name: shard-2, dbs: "2" }
          - { name: shard-3, dbs: "3" }
    env:
      MIX_ENV: test
    # Real PostgreSQL for AshA2A.Test.Repo (config/test.exs); credentials and
    # host port 55432 match it exactly. config/test.exs names the database
    # `ash_a2a_test<MIX_TEST_PARTITION>`; shard lanes create theirs below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build
        with:
          format: ${{ matrix.format || 'false' }}
          save-cache: ${{ matrix.save || 'false' }}
      # FreedomGymOcelConformanceE2ETest boots beam4pm's hermetic OCEL ingest
      # server and fails closed without a checkout (HERMETIC-INGEST-UNAVAILABLE).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.name == 'solo' }}
        with:
          repository: seanchatmangpt/beam4pm
          path: beam4pm
          persist-credentials: false
      - name: Point the OCEL e2e court at the beam4pm checkout
        if: ${{ matrix.name == 'solo' }}
        run: echo "BEAM4PM_PATH=${{ github.workspace }}/beam4pm" >> "$GITHUB_ENV"
      # The HDDL planning tests execute native/hddl_cli (hddl_cli_not_built otherwise).
      - name: Build ferroplan-backed HDDL CLI
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build --manifest-path native/hddl_cli/Cargo.toml --release --locked
      - name: Create partition database
        if: ${{ matrix.dbs }}
        env:
          MIX_TEST_PARTITION: ${{ matrix.dbs }}
        run: mix ecto.create
      # TQ-09: each lane exports coverage; the threshold is evaluated once, on
      # the merged data, by the `test` job (`--export-coverage` alone never
      # evaluates it).
      - name: Fast async lane
        if: ${{ matrix.name == 'quick' }}
        run: mix test --cover --export-coverage fast
      - name: Serial shard 1 of 3
        if: ${{ !cancelled() && matrix.name == 'quick' }}
        env:
          MIX_TEST_PARTITION: "1"
        run: mix test.serial.shard --partitions 3 --cover --export-coverage shard-1
      # `:serial_solo` (~23 files) holds host-level shared resources (fixed
      # ports, :peer, shared Postgres, native subprocess): it runs alone.
      - name: Serial solo lane
        if: ${{ matrix.name == 'solo' }}
        run: mix test.serial.solo --cover --export-coverage solo
      # Files tagged `:serial` but in neither `:serial_shard` nor `:serial_solo`
      # matched no lane (the fast lane excludes `:serial`), so they never ran in
      # CI. Selected by path at run time so a newly added file cannot be missed.
      - name: Serial untiered files
        if: ${{ matrix.name == 'solo' }}
        shell: bash
        run: |
          files=$(grep -rlE '(moduletag|tag) :serial\b' test | xargs grep -LE 'serial_(shard|solo)' || true)
          [ -z "$files" ] && { echo "no untiered serial files"; exit 0; }
          echo "$files"
          mix test.serial $files --cover --export-coverage rest
      - name: Serial shard (${{ matrix.name }})
        if: ${{ startsWith(matrix.name, 'shard-') }}
        env:
          MIX_TEST_PARTITION: ${{ matrix.dbs }}
        run: mix test.serial.shard --partitions 3 --cover --export-coverage ${{ matrix.name }}
      # Uploaded even when a test failed: Mix exports coverage regardless, and
      # the `test` job merges whatever exists so the merge path is exercised and
      # a coverage number is reported on every run, not only fully-green ones.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverdata-${{ matrix.name }}
          path: cover/*.coverdata
          retention-days: 1
          if-no-files-found: warn

  # The required check `test`: green only if every lane succeeded AND the
  # merged coverage meets the mix.exs floor. One job instead of a separate
  # coverage job plus an aggregate -- each extra stage costs a queue wait.
  # The merge runs whatever the lanes did (so it is exercised on every run);
  # the lane verdict is asserted last and can still fail the job.
  test:
    needs: lane
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverdata-*
          merge-multiple: true
          path: cover
      - run: mix test.coverage
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: cover/
          if-no-files-found: warn
      - name: Require every lane to have succeeded
        if: ${{ always() }}
        env:
          LANE: ${{ needs.lane.result }}
        run: |
          echo "lane=$LANE"
          test "$LANE" = success

  # Conference-sim court suite (EV16 wiring): the AGNTCon event-model courts
  # under test/conference_sim/. The court files are deliberately named
  # `*_court.exs`, which ExUnit's default `*_test.exs` pattern does NOT
  # collect, so this job passes the explicit path list (the minimal correct
  # wiring -- no mix.exs :test_patterns change). fixture_test.exs IS collected
  # by default, but the courts are gated on the shared ConferenceSim fixture
  # being compiled (mix.exs elixirc_paths(:test) already includes
  # test/conference_sim), so it is listed too to run the family in one
  # process. No Postgres service: every court runs on real Ash/ETS resources
  # and real GenServers (grep-verified: the only "Repo" mention in
  # test/conference_sim/ is a comment), so no :requires_pg tag exists and
  # none is excluded.
  #
  # Non-gating on purpose, not silently: the suite was measured red at wiring
  # time (112 tests / 46 failures / 4 invalid across the EV lanes, which were
  # still landing). TODO(ci-ev16): drop `continue-on-error` the moment a run
  # witnesses a green suite on this branch -- same promotion rule as the
  # `conformance` job's TODO(ci-g3) ledger.
  conference-sim:
    name: conference-sim (AGNTCon court suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true # TODO(ci-ev16): promote once witnessed green
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: ./.github/actions/build
      - name: Conference-sim court suite
        run: >-
          mix test test/conference_sim/fixture_test.exs
          test/conference_sim/*_court.exs

  # Lane CI-1 (G3, CI half of the `mix check` gap): the A2A v1.0 conformance
  # court report. One command runs every pinned v1.0 court as a REAL OS
  # subprocess (lib/mix/tasks/ash_a2a.v1_conformance_report.ex,
  # the @v1_courts list) and writes one machine-readable JSON verdict; the task
  # always exits 0, so the gate is the JSON itself: totals.fail == 0.
  #
  # Non-gating on purpose, not silently: `.check.exs`' honest-staging ledger
  # (measured 2026-10-04) records this stage "WIRED, not yet run to completion
  # here". TODO(ci-g3): drop `continue-on-error` the moment a run witnesses
  # totals.fail == 0 on main -- same promotion rule as the .check.exs ledger.
  # The report is uploaded even on failure so the FAIL is durable evidence.
  conformance:
    name: conformance (v1 court report)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true # see TODO(ci-g3) above; promotion = witnessed green
    env:
      MIX_ENV: test
    # Real PostgreSQL, identical to the `lane` job: several v1 courts run the
    # suite's own test config (ash_a2a_test on host port 55432).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Same toolchain pin (.tool-versions), same deps, same compile gate as
      # every lane: the courts run against the same admitted build.
      - uses: ./.github/actions/build
      - name: A2A v1.0 conformance court report (real subprocess per court)
        run: mix ash_a2a.v1_conformance_report --out v1-conformance.json
      - name: Gate on the report's own documented gate (totals.fail == 0)
        run: jq -e '.totals.fail == 0' v1-conformance.json > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: v1-conformance-${{ github.event.pull_request.head.sha || github.sha }}
          path: v1-conformance.json
          retention-days: 7
          if-no-files-found: error

  # Docs gate (G3): `mix docs` so doc breakage (bad extras list, broken
  # doc references) is caught in CI. Known-red today, per the same ledger:
  # "docs RED -- ExDoc.Extras.build/2 raises on the current extras list
  # (mix.exs docs/0); ownership: mix.exs docs config". Included, not hidden.
  # TODO(ci-g3): fix the extras list in mix.exs docs/0, then drop
  # `continue-on-error` -- the ledger is the tracker item.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true # TODO(ci-g3) above; see .check.exs docs RED entry
    env:
      MIX_ENV: dev # ex_doc is `only: :dev` (mix.exs); docs build in dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      # Dev-env cache, keyed on the real invalidators only (no Rust, no child
      # projects: ex_doc needs neither).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-docs-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-a2a-v2-docs-${{ runner.os }}-
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Verify mix.lock unchanged
        run: git diff --exit-code -- mix.lock
      - run: mix docs

  # Credo gate (mirrors .check.exs `credo` stage: `mix credo --strict`).
  # Known-red per the .check.exs honest-staging ledger (288 findings at first
  # strict run). TODO(ci-g3-credo): drop `continue-on-error` when
  # `mix credo --strict` exits 0 on main; tracker = .check.exs ledger.
  credo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # TODO(ci-g3-credo) above
    env:
      MIX_ENV: dev # credo is `only: :dev` (mix.exs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - run: mix credo --strict

  # Dialyzer gate (mirrors .check.exs `dialyzer` stage). PLT cache is keyed on
  # OTP + Elixir (.tool-versions) and mix.lock. Cold PLT build takes tens of
  # minutes. TODO(ci-g3-dialyzer): drop `continue-on-error` when
  # `mix dialyzer` exits 0 on main; tracker = .check.exs ledger.
  dialyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true # TODO(ci-g3-dialyzer) above
    env:
      MIX_ENV: dev # dialyxir is `only: [:dev]` (mix.exs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-dialyzer-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-a2a-v2-dialyzer-${{ runner.os }}-
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - run: mix dialyzer

  # Sleep gate (no-sleep doctrine). Unconditional: a missing script fails the job.
  sleep-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Ensure ripgrep
        run: command -v rg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - name: Run scripts/sleep_gate.sh
        run: bash scripts/sleep_gate.sh
