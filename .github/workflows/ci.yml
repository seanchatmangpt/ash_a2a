name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.0"
          elixir-version: "1.19.0"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ash-a2a-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - name: Materialize formatter repair candidate
        run: mix format
      - name: Preserve formatter repair candidate
        uses: actions/upload-artifact@v4
        with:
          name: formatter-repair
          path: |
            lib/ash_a2a/planning/semantic_synthesis.ex
            test/ash_a2a/semantic_synthesis_test.exs
      - name: Verify formatting is committed
        run: git diff --exit-code
      - run: mix compile --warnings-as-errors
      - run: mix test
