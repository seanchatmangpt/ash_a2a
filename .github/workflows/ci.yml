name: CI

on:
  push:
    branches: [main]
  pull_request:

# Shape: `supply-chain` (fast) + `lane` x4 (the suite split along the repo's own
# documented, measured seams) -> `test` (merged coverage, threshold-gated; keeps
# the required check name). Rust
# advisories/licenses and the package-closure check live in
# supply-chain-deep.yml (lock-touching PRs + weekly), so a newly published
# advisory cannot turn unrelated PRs red.
#
# A cancelled superseded PR head yields no receipt by design: only the latest
# head of a PR is admitted; main/dispatch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at workflow scope; no job here writes to the repository.
permissions:
  contents: read

env:
  # ekv 0.4.3's checksum.exs lists only 0.3.0 precompiled artifacts, so a
  # non-dev/test build fails the checksum lookup and falls back to a source
  # build by accident. Choose the source build deliberately (SC-03).
  EKV_BUILD: "1"

jobs:
  # Supply-chain gate (SC-02): lock drift, Hex advisories and Rust
  # advisories/bans/licenses/sources for both crates. Fails closed on every PR;
  # cheap because cargo-deny is a release binary (seconds), not a source build.
  # The heavier package-closure check lives in supply-chain-deep.yml.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Refuse mix.lock drift
        run: mix deps.get --check-locked
      - name: Refuse retired / security-advisory Hex packages
        run: mix hex.audit
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # Official maintainer release binary (was: `cargo install`, compiled from
      # source every run). Version + SHA-256 pinned; the digest was taken from
      # the downloaded 0.20.2 musl release asset (trust-on-first-use).
      - name: Install cargo-deny (release binary)
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          asset="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${asset}.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${asset}/cargo-deny" /usr/local/bin/cargo-deny
      - name: cargo-deny (hddl_cli)
        run: >-
          cargo deny --manifest-path native/hddl_cli/Cargo.toml
          --config .github/cargo-deny.toml --locked
          check advisories bans licenses sources
      - name: cargo-deny (graphlaw_host)
        run: >-
          cargo deny --manifest-path native/graphlaw_host/Cargo.toml
          --config .github/cargo-deny.toml --locked
          check advisories bans licenses sources

  # The suite, split along the seams mix.exs already documents: the async fast
  # lane, the `:serial_solo` files (host-level shared resources: fixed ports,
  # :peer, shared Postgres, native subprocess -- never sharded), and the
  # `:serial_shard` files (VM-local shared state -- safe as N OS processes).
  # Each lane is its own runner with its own Postgres service, so no
  # cross-lane resource can collide. Setup is ~1 min warm; tests dominate.
  lane:
    name: lane (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # one push should reveal every red lane, not the first
      matrix:
        # Balanced from measured test times (4a647a9): fast 2.1 min, solo
        # 5.0 min, shard-1 1.5 min, shard-2 4.3 min, shard-3 4.4 min.
        include:
          - { name: quick, dbs: "1", format: "true", save: "true" } # fast + shard-1
          - { name: solo }
          - { name: shard-2, dbs: "2" }
          - { name: shard-3, dbs: "3" }
    env:
      MIX_ENV: test
    # Real PostgreSQL for AshA2A.Test.Repo (config/test.exs); credentials and
    # host port 55432 match it exactly. config/test.exs names the database
    # `ash_a2a_test<MIX_TEST_PARTITION>`; shard lanes create theirs below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build
        with:
          format: ${{ matrix.format || 'false' }}
          save-cache: ${{ matrix.save || 'false' }}
      - name: Create partition database
        if: ${{ matrix.dbs }}
        env:
          MIX_TEST_PARTITION: ${{ matrix.dbs }}
        run: mix ecto.create
      # TQ-09: each lane exports coverage; the threshold is evaluated once, on
      # the merged data, by the `test` job (`--export-coverage` alone never
      # evaluates it).
      - name: Fast async lane
        if: ${{ matrix.name == 'quick' }}
        run: mix test --cover --export-coverage fast
      - name: Serial shard 1 of 3
        if: ${{ !cancelled() && matrix.name == 'quick' }}
        env:
          MIX_TEST_PARTITION: "1"
        run: mix test.serial.shard --partitions 3 --cover --export-coverage shard-1
      # `:serial_solo` (~23 files) holds host-level shared resources (fixed
      # ports, :peer, shared Postgres, native subprocess): it runs alone.
      - name: Serial solo lane
        if: ${{ matrix.name == 'solo' }}
        run: mix test.serial.solo --cover --export-coverage solo
      - name: Serial shard ${{ matrix.dbs }} of 3
        if: ${{ startsWith(matrix.name, 'shard-') }}
        env:
          MIX_TEST_PARTITION: ${{ matrix.dbs }}
        run: mix test.serial.shard --partitions 3 --cover --export-coverage ${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverdata-${{ matrix.name }}
          path: cover/*.coverdata
          retention-days: 1
          if-no-files-found: error

  # The required check `test`: green only if every lane succeeded AND the
  # merged coverage meets the mix.exs floor. One job instead of a separate
  # coverage job plus an aggregate -- each extra stage costs a queue wait.
  test:
    needs: lane
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - name: Require every lane to have succeeded
        env:
          LANE: ${{ needs.lane.result }}
        run: |
          echo "lane=$LANE"
          test "$LANE" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverdata-*
          merge-multiple: true
          path: cover
      - run: mix test.coverage
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: cover/
          if-no-files-found: warn
