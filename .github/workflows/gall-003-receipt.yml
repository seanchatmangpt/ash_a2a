name: GALL-003 durable receipt court

on:
  pull_request:
    branches:
      - gall/checkpoint-003-command-authority
    paths:
      - "lib/ash_a2a/gall/command_receipt.ex"
      - "scripts/gall_checkpoint_003_receipt.exs"
      - "test/gall_checkpoint_003_command_authority_chicago_test.exs"
      - "test/ash_a2a_gall_command_authority_test.exs"
      - ".github/workflows/gall-003-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Deliberate ekv source build (SC-03): ekv 0.4.3 ships no 0.4.3 checksums.
  EKV_BUILD: "1"

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}-
            ash-a2a-v2-mix-${{ runner.os }}-test-
      - run: mix deps.get --check-locked
      - name: Compile (test env) for cache admission
        id: compile
        env:
          MIX_ENV: test
        run: mix compile
      - name: Parse portable receipt court
        env:
          MIX_ENV: test
        run: elixir -e 'File.read!("scripts/gall_checkpoint_003_receipt.exs") |> Code.string_to_quoted!()'

      - name: Run narrow CommandBus courts
        env:
          MIX_ENV: test
        run: |
          mix test             test/gall_checkpoint_003_command_authority_chicago_test.exs             test/ash_a2a_gall_command_authority_test.exs
      # Immutable-key discipline: save only a COMPLETE build (compile step succeeded),
      # even if a later step fails, under a per-run unique key so a later good run
      # can save again; never after cancel or a failed compile (no partial cache).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        with:
          path: |
            deps
            _build
          key: ash-a2a-v2-mix-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}-${{ github.run_id }}
