name: v26.9.28 GALL formatter

on:
  push:
    branches:
      - release/v26.9.28-gall-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v26.9.28-gall-format
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.0.2"
      - name: Resolve formatter dependencies
        run: mix deps.get
      - name: Format GALL release tranche
        run: |
          mix format \
            'lib/ash_a2a/gall/**/*.ex' \
            'test/ash_a2a/gall/**/*.exs'
      - name: Commit normalization
        run: |
          if git diff --quiet; then
            echo "GALL tranche already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ash_a2a/gall test/ash_a2a/gall
          git commit -m "style(gall): normalize v26.9.28 runtime closure"
          git push origin HEAD:release/v26.9.28-gall-format
