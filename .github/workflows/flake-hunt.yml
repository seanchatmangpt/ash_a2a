# Nightly flake hunt (TQ-10). The PR/push CI runs the suite once with one
# random seed, so order-dependent and scheduling-dependent failures are only
# caught by chance. This workflow runs the full suite under a fixed seed
# matrix plus high --max-cases, and repeats the historically racy files until
# failure. A failing seed is preserved as an artifact so it can be replayed
# exactly (`mix test.all --seed <seed>`).
name: Flake hunt

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  EKV_BUILD: "1"

jobs:
  seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 42, 1337, 99991]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            native/hddl_cli/target
            native/graphlaw_host/target
          key: ash-a2a-flake-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock', 'native/hddl_cli/Cargo.lock', 'native/graphlaw_host/Cargo.lock') }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo +1.97.1 build --manifest-path native/hddl_cli/Cargo.toml --release --locked
      - run: cargo +1.97.1 build --manifest-path native/graphlaw_host/Cargo.toml --release --locked
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Full suite, fixed seed ${{ matrix.seed }}
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -o pipefail
          mix test.all --seed "$SEED" --max-cases 64 --slowest 20 2>&1 | tee "test-seed-$SEED.log"
      - name: Preserve failing seed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-seed-${{ matrix.seed }}-${{ github.sha }}
          path: test-seed-*.log

  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ash-a2a-flake-repeat-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Repeat historically racy files until failure
        run: |
          set -o pipefail
          mix test.all --repeat-until-failure 50 \
            test/ash_a2a/planning/request_router_phrase_tier_test.exs \
            test/ash_a2a_cancel_inflight_test.exs \
            test/ash_a2a/receipt_store/actuation_claim_lease_test.exs 2>&1 | tee repeat.log
      - name: Preserve repeat log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-repeat-${{ github.sha }}
          path: repeat.log
