# SA2A exact-SHA court receipts, on a schedule (ASH_A2A-26922-10).
#
# Why this workflow exists: the only SA2A conformance/standing receipts this
# repo produced previously were ExUnit tmp/ output -- and tmp/ is gitignored,
# so no durable receipt ever survived the session that produced it. This
# workflow runs the two real courts against the exact pushed subject and
# publishes both receipts as one artifact named by that exact SHA, so a
# receipt is always re-derivable for any main commit:
#
#   gh run download <id> -n sa2a-conformance-$(git rev-parse origin/main)
#   jq -e '.result=="PASS"' sa2a-conformance.json
#   [ "$(jq -r .standing chicago/standing_receipt.json)" = CONFORMANT ]
#
# `--require-conformant` makes the job fail closed: a NONCONFORMANT or
# PARTIAL_ALIVE court run is a red workflow, not a green one with an ugly
# receipt attached. Hand-reviewed repo-side durable receipts live in
# receipts/v26.9.22/ (committed, unlike tmp/).

name: SA2A conformance receipts

on:
  push:
    branches: [main]
  schedule:
    # Daily; a receipt per exact main SHA, regenerated if the environment
    # ever drifts out from under an unchanged subject.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Deliberate ekv source build (SC-03): ekv 0.4.3 ships no 0.4.3 checksums.
  EKV_BUILD: "1"

jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One MIX_ENV for compile and every court step: the admission tripwire
      # and courts reuse this compile instead of recompiling in test env.
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_a2a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
            native/hddl_cli/target
            native/graphlaw_host/target
          key: ash-a2a-v2-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'native/hddl_cli/Cargo.lock', 'native/graphlaw_host/Cargo.lock') }}
          restore-keys: |
            ash-a2a-v2-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'native/hddl_cli/Cargo.lock', 'native/graphlaw_host/Cargo.lock') }}-
            ash-a2a-v2-${{ runner.os }}-test-
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build exact ferroplan-backed HDDL CLI
        run: cargo +1.97.1 build --manifest-path native/hddl_cli/Cargo.toml --release --locked
      # SA2A-XRUNTIME-002's positive control executes the real wasmtime
      # runtime B through this native host; without it the court degrades to
      # PARTIAL_ALIVE (cross-runtime control blocked), never CONFORMANT.
      - name: Build graphlaw_host (wasmtime runtime B)
        run: cargo +1.97.1 build --release --locked --manifest-path native/graphlaw_host/Cargo.toml
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      # test-env deps.get skips dev-only deps: fail if it had to rewrite the lock.
      - name: Verify mix.lock unchanged
        run: git diff --exit-code -- mix.lock
      - id: compile
        run: mix compile --warnings-as-errors
      # Immutable-key discipline: save only a COMPLETE build (compile step succeeded),
      # even if a later step fails, under a per-run unique key so a later good run
      # can save again; never after cancel or a failed compile (no partial cache).
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        with:
          path: |
            deps
            _build
            native/hddl_cli/target
            native/graphlaw_host/target
          key: ash-a2a-v2-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'native/hddl_cli/Cargo.lock', 'native/graphlaw_host/Cargo.lock') }}-${{ github.run_id }}
      # Tripwire: court machinery must be admitted. A lib change that moves a
      # court digest without a reviewed re-pin is drift, and this fails the
      # job before a drifted receipt can even be produced.
      - name: Court manifest admission check
        env:
          MIX_ENV: test
        run: mix ash_a2a.chicago.pin_court_manifest --check
      # The strict conformance corpus is RECORDED, not gating: its
      # v006_blank_nodes vector fails deterministically on every host ("input
      # identity is not a function of the input graph" -- graph_hash/1 is not
      # stable across repetition for blank-node graphs, identically on both
      # runtimes; first observed on run 35801843677 at 9f22374, matching the
      # survey finding that no strict-profile CONFORMANT receipt exists).
      # Fixing blank-node graph hashing is a praxis-graphlaw change, not a
      # workflow flag. The receipt is still published so the FAIL is durable
      # evidence, never hidden.
      - name: SA2A strict conformance corpus court (recorded)
        id: strict
        continue-on-error: true
        env:
          MIX_ENV: test
        run: mix ash_a2a.sa2a_conformance --out sa2a-conformance.json
      # The court needs the same runtime collaborators ExUnit's test_helper
      # provides: a live InMemory authority broker (without it
      # SA2A-TRANSPORT-004/005 block on {:noproc, ...}) and test-env config.
      #
      # This step is RECORDED, not gating, and that is a design fact, not a
      # workaround: SA2A-TOPO-002 is a gate-3 positive control whose real
      # collaborators are the 11 author-workstation sibling checkouts, so a
      # hosted runner honestly reports NONCONFORMANT (observed on run
      # 35807754326 at 43ac109: gates 3/3 PASSED, 134 falsifiers killed,
      # 0 blocked -- and TOPO-002 survived because the topology is absent).
      # The profiles are cumulative and no designed profile excludes the
      # workstation-bound court, so a hosted CONFORMANT claim is impossible
      # without weakening the court, which is not on the menu. The receipt
      # IS the deliverable: its standing field carries the truth, and the
      # workstation run (proven CONFORMANT locally at the re-pinned
      # manifest) is where that standing is earned.
      - name: Chicago core standing court (recorded)
        if: always()
        env:
          MIX_ENV: test
        run: >-
          mix run --eval
          '{:ok, _} = AshA2A.Authority.Broker.InMemory.start_link([]);
          Mix.Task.run("ash_a2a.chicago",
          ["--profile", "core", "--evidence-dir", "chicago"])'
      - name: Publish exact-SHA receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sa2a-conformance-${{ github.sha }}
          path: |
            sa2a-conformance.json
            chicago/standing_receipt.json
          if-no-files-found: error
