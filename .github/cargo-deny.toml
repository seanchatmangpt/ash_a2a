# cargo-deny policy for the two native crates (native/hddl_cli,
# native/graphlaw_host). CI runs:
#   cargo deny --manifest-path native/<crate>/Cargo.toml \
#     check --config .github/cargo-deny.toml advisories bans licenses sources
# Fails closed on RustSec advisories, yanked crates, non-allowlisted licenses,
# and any git/registry source other than crates.io + the pinned ferroplan repo.

[graph]
all-features = false

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/seanchatmangpt/ferroplan.git"]
