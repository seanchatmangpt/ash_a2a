[package]
name = "hddl_cli"
version = "0.1.0"
edition = "2021"
description = """
Real, small, standalone binary crate: parses two HDDL file paths (domain,
problem) from argv, calls ferroplan::solve_hddl from the canonical ferroplan
repository pinned to the exact commit carried by beam4pm's ferroplan submodule,
and prints the real UniversalPlan (or a {\"error\": ...} object on failure) as
JSON on stdout.

Why a subprocess instead of an in-process NIF/dependency from ash_a2a's own
mix.exs: ash_a2a is a general-purpose Ash extension library (published,
consumed by arbitrary host apps) and must not carry a hard dependency on one
specific consumer app's BEAM-side manufacturing pipeline or its ggen-generated
Elixir surface. The Rust dependency is therefore the canonical ferroplan source
itself, not an ambient sibling checkout and not a reimplementation or mock.
"""
license = "MIT"

[[bin]]
name = "hddl_cli"
path = "src/main.rs"

[dependencies]
ferroplan = { git = "https://github.com/seanchatmangpt/ferroplan.git", rev = "29134d7bc2c578aa39e05bceeee43a6893f2026b" }
serde_json = "1"
