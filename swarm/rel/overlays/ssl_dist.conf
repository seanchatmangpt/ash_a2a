%% Erlang distribution over TLS (-proto_dist inet_tls), DEP-07 / SEC-10.
%% Loaded via -ssl_dist_optfile (see rel/env.sh.eex). Certificates are mounted
%% read-only from the Kubernetes Secret `ash-a2a-swarm-dist-tls` (cert-manager
%% Certificate or k8s/deploy.sh's generated CA) at /etc/ash_a2a/dist.
%%
%% Both directions verify the peer against the cluster CA; the server refuses
%% a peer that presents no certificate. Hostname verification is disabled on
%% the client side (server_name_indication = disable) because nodes are
%% addressed by pod IP (swarm_node@$(POD_IP)), which is not known when the
%% certificate is issued; peer authentication is the private-CA chain, so the
%% CA must be dedicated to this cluster's distribution and never shared.
[{server,
  [{certfile, "/etc/ash_a2a/dist/tls.crt"},
   {keyfile, "/etc/ash_a2a/dist/tls.key"},
   {cacertfile, "/etc/ash_a2a/dist/ca.crt"},
   {verify, verify_peer},
   {fail_if_no_peer_cert, true},
   {versions, ['tlsv1.3', 'tlsv1.2']},
   {secure_renegotiate, true}]},
 {client,
  [{certfile, "/etc/ash_a2a/dist/tls.crt"},
   {keyfile, "/etc/ash_a2a/dist/tls.key"},
   {cacertfile, "/etc/ash_a2a/dist/ca.crt"},
   {verify, verify_peer},
   {server_name_indication, disable},
   {versions, ['tlsv1.3', 'tlsv1.2']},
   {secure_renegotiate, true}]}].
