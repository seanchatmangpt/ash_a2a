# SEC-NET-001 (kubernetes-workload-pack's control-map.md): default-deny
# NetworkPolicy + explicit allowed flows.
#
# Ingress:
#   * 4369 (epmd) and 9000 (TLS distribution) ONLY from pods of this workload
#     (podSelector app=ash-a2a-swarm) -- no other pod or namespace can reach
#     the distribution ports (SEC-10).
#   * 4000 (opt-in A2A HTTP) ONLY from the ingress controller's namespace
#     (namespaceSelector kubernetes.io/metadata.name=ingress-nginx; change
#     the value in an overlay for another controller).
#   * 4001 (admin: /healthz /readyz /drain) from nothing: kubelet probes and
#     the preStop hook come from the node, not from a pod.
# Egress: DNS (kube-dns) + pod-to-pod on 4369/9000. External egress (OCEL
# ingest, LLM providers) is denied here and must be granted explicitly per
# destination -- see k8s/overlays/prod/egress-external.yaml (DEP-09).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ash-a2a-swarm-default-deny
  namespace: ash-a2a-swarm
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ash-a2a-swarm-allow-cluster-traffic
  namespace: ash-a2a-swarm
spec:
  podSelector:
    matchLabels:
      app: ash-a2a-swarm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ash-a2a-swarm
      ports:
        - port: 4369
          protocol: TCP
        - port: 9000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 4000
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ash-a2a-swarm
      ports:
        - port: 4369
          protocol: TCP
        - port: 9000
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
