apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: actuator-system
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - networkpolicy.yaml
  - service.yaml
  - statefulset.yaml
# The `actuator-tls` Secret (tls.crt, tls.key, ca.crt) is created out of band by the
# operator's certificate tooling; it is never committed and never lives in the control
# plane's namespaces.
