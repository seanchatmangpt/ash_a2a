# Default deny both directions, then ONE ingress allowance: the mTLS port, only from the
# authority and control-plane namespaces. No egress at all (no DNS, no external reach):
# the actuator's only effector is its own ledger. No epmd or distribution port is
# exposed anywhere: RELEASE_DISTRIBUTION=none (RFC-SA2A-007 E-D).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: actuator-default-deny
  namespace: actuator-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: actuator-allow-authority-and-control-plane
  namespace: actuator-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: actuator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - authority-system
                  - control-plane
      ports:
        - protocol: TCP
          port: 8443
