# Actuator trust domain (RFC-SA2A-006 s7.5). Own namespace: nothing from the control
# plane's namespaces shares its network, service account, secrets or volumes.
apiVersion: v1
kind: Namespace
metadata:
  name: actuator-system
  labels:
    app.kubernetes.io/part-of: sa2a
    sa2a.trust-domain: actuator
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
