# NAMESPACE_CONTROL layer (control-map.md's SEC-QUOTA-001): the aggregate
# DoS/OOM boundary. Sized for 3 Guaranteed-QoS replicas (1 CPU / 1Gi each,
# requests == limits, deployment.yaml) plus one pod of headroom for a replica
# that is still terminating while its replacement starts during a rolling
# update, plus their PersistentVolumeClaims (10Gi each).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ash-a2a-swarm-quota
  namespace: ash-a2a-swarm
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    persistentvolumeclaims: "4"
    requests.storage: 40Gi
