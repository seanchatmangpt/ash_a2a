# ClusterIP only; mutual-TLS on 8443 (the NetworkPolicy is a second, independent fence).
apiVersion: v1
kind: Service
metadata:
  name: authority-service
  namespace: authority-system
  labels:
    app: authority-service
spec:
  type: ClusterIP
  selector:
    app: authority-service
  ports:
    - name: issue
      port: 8443
      targetPort: issue
      protocol: TCP
