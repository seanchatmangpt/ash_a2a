# Default deny (ingress + egress), then exactly one allowed flow: the service port, from the
# actuator and control-plane namespaces only. No egress at all: the service verifies with
# local registry files and holds no outbound dependency (the approver channel, when wired,
# gets its own explicit egress policy in an overlay). No distribution ports (4369, 9000)
# are ever opened: the release runs with RELEASE_DISTRIBUTION=none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authority-default-deny
  namespace: authority-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authority-allow-issue-requests
  namespace: authority-system
spec:
  podSelector:
    matchLabels:
      app: authority-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: actuator-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: control-plane
      ports:
        - port: 8443
          protocol: TCP
