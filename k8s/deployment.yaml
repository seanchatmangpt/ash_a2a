# Hand-authored (see k8s/README.md). Security posture matches
# ~/ggen-marketplace/packs/kubernetes-workload-pack/examples/
# high-assurance-workload/facts.ttl field-for-field (SEC-POD-001/002/003,
# SEC-CTR-001/002/003, SEC-RES-001, SEC-AVAIL-001, SEC-ID-001/002).
#
# Workload kind is a StatefulSet (the file keeps its historical name so
# existing tooling paths do not break): the receipt store, authority broker and
# receipt outbox are durable state (DEP-03), so each replica gets a stable
# identity (swarm_node@<pod>.ash-a2a-swarm-headless...) and its own
# PersistentVolumeClaim `data` mounted at /var/lib/ash_a2a. /tmp stays an
# emptyDir for RELEASE_TMP only -- nothing durable is written there.
#
# This base is the kind/CI shape (local image, imagePullPolicy Never). The
# production shape -- registry image pinned by @sha256 digest, zone/host
# spread enforced, cert-manager-issued distribution certificates, explicit
# external egress -- is k8s/overlays/prod (kustomize).
#
# Required Secrets (never committed; k8s/deploy.sh generates them for kind,
# production sources them from an external secret manager):
#   ash-a2a-swarm-cookie    key `cookie`
#   ash-a2a-swarm-keys      keys `receipt-binding-key`, `standing-ledger-key`
#                           (base64 of 32 random bytes each)
#   ash-a2a-swarm-dist-tls  keys `tls.crt`, `tls.key`, `ca.crt` (cluster CA)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ash-a2a-swarm
  namespace: ash-a2a-swarm
  labels:
    app: ash-a2a-swarm
spec:
  serviceName: ash-a2a-swarm-headless
  replicas: 3
  # All replicas start together: EKV quorum (cluster_size 3 -> 2 voters) and
  # readiness (SWARM_MIN_PEERS=1) both need peers, so ordered start would
  # stall pod-0 waiting for pods that are not created yet.
  podManagementPolicy: Parallel
  # Zero-downtime rolling update (DEP-05): one pod at a time, and a pod
  # counts as available only after /readyz has held for minReadySeconds.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  minReadySeconds: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: ash-a2a-swarm
  template:
    metadata:
      labels:
        app: ash-a2a-swarm
    spec:
      serviceAccountName: ash-a2a-swarm
      # SEC-ID-002: libcluster's Kubernetes DNS strategies talk to plain DNS,
      # never the Kubernetes API server -- no token is ever needed.
      automountServiceAccountToken: false
      # preStop drain (15 s) + BEAM shutdown must fit inside this window.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # DEP-06: spread replicas across nodes and zones so one node drain or
      # zone loss cannot take the quorum. ScheduleAnyway here so a one-node
      # kind cluster still schedules; k8s/overlays/prod enforces
      # DoNotSchedule for kubernetes.io/hostname.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ash-a2a-swarm
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ash-a2a-swarm
      containers:
        - name: swarm-node
          # Local kind image; production pins a registry digest via
          # k8s/overlays/prod (kustomize `images:` with `digest:`), see
          # k8s/README.md "Supply chain".
          image: ash-a2a-swarm-node:local
          # Never: the kind/CI air-gap test (NIST SP 800-53 SA-9) schedules
          # from a kind-loaded image with no registry pull. The prod overlay
          # patches this to IfNotPresent.
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: epmd
              containerPort: 4369
            - name: dist
              containerPort: 9000
            # Opt-in A2A JSON-RPC surface (SWARM_A2A_HTTP=true), DEP-09.
            - name: a2a-http
              containerPort: 4000
            # Kubelet-only admin surface: /healthz /readyz /drain. No Service
            # selects it and the NetworkPolicy admits no pod traffic to it.
            - name: admin
              containerPort: 4001
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE_DISTRIBUTION
              value: "name"
            # Stable per-replica node name (StatefulSet DNS), so a
            # rescheduled pod rejoins EKV/libcluster under the same identity.
            - name: RELEASE_NODE
              value: "swarm_node@$(POD_NAME).ash-a2a-swarm-headless.$(POD_NAMESPACE).svc.cluster.local"
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: ash-a2a-swarm-cookie
                  key: cookie
            - name: RELEASE_TMP
              value: "/tmp"
            - name: SWARM_K8S_SERVICE
              value: "ash-a2a-swarm-headless"
            # Selects libcluster's Kubernetes.DNSSRV strategy (stable pod
            # hostnames) in swarm/config/runtime.exs.
            - name: SWARM_K8S_NAMESPACE
              value: "$(POD_NAMESPACE)"
            # Distribution over mutually-authenticated TLS (DEP-07 / SEC-10);
            # certs from the ash-a2a-swarm-dist-tls Secret (volume below).
            - name: SWARM_DIST_TLS
              value: "true"
            # Match the CPU limit (DEP-12).
            - name: SWARM_SCHEDULERS
              value: "1"
            - name: SWARM_MIN_PEERS
              value: "1"
            - name: SWARM_DRAIN_MS
              value: "15000"
            - name: SWARM_REQUIRE_GRAPHLAW
              value: "true"
            - name: SWARM_A2A_HTTP
              value: "false"
            # Durable state on the PVC (DEP-02 / DEP-03).
            - name: ASH_A2A_EKV_CLUSTER_SIZE
              value: "3"
            - name: ASH_A2A_RECEIPT_DATA_DIR
              value: "/var/lib/ash_a2a/receipts"
            - name: ASH_A2A_BROKER_DATA_DIR
              value: "/var/lib/ash_a2a/broker"
            - name: ASH_A2A_OUTBOX_DIR
              value: "/var/lib/ash_a2a/outbox"
            # Frozen capability-release closure (strict release gate). The
            # digest is the closure's portable_digest over
            # swarm/rel/overlays/capability_release.json; editing the manifest
            # without updating this value refuses boot (by design). Release is
            # standing-bound: the court receipt backing each entry is resolved
            # from ASH_A2A_STANDING_ARTIFACTS_DIR (the rel/overlays/standing/
            # artifact receipts vendored from the ash_a2a checkout).
            - name: ASH_A2A_CAPABILITY_RELEASE_MANIFEST
              value: "/app/capability_release.json"
            - name: ASH_A2A_CAPABILITY_RELEASE_DIGEST
              value: "sha256:6d80bcc8ad9921151c51a9425ea47c74c90ff152fa2550515d0446523300b3d4"
            - name: ASH_A2A_STANDING_ARTIFACTS_DIR
              value: "/app/standing"
            - name: ASH_A2A_RECEIPT_BINDING_KEY
              valueFrom:
                secretKeyRef:
                  name: ash-a2a-swarm-keys
                  key: receipt-binding-key
            - name: ASH_A2A_STANDING_LEDGER_KEY
              valueFrom:
                secretKeyRef:
                  name: ash-a2a-swarm-keys
                  key: standing-ledger-key
          # Guaranteed QoS (requests == limits, DEP-12): the pod is the last
          # to be evicted under node memory pressure, and SWARM_SCHEDULERS=1
          # matches the CPU limit so the BEAM is not CFS-throttled.
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          # DEP-05 probes against the admin HTTP surface (SwarmNode.Health).
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          # DEP-06 graceful drain: /drain marks the node not-ready and blocks
          # SWARM_DRAIN_MS (a fixed window, not an in-flight tracker) so the
          # endpoint is withdrawn and short in-flight work
          # can finish; then SIGTERM runs the release's orderly :init.stop.
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: admin
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/ash_a2a
            - name: dist-tls
              mountPath: /etc/ash_a2a/dist
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: dist-tls
          secret:
            secretName: ash-a2a-swarm-dist-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
