# Hand-authored (see k8s/README.md). Security posture matches
# ~/ggen-marketplace/packs/kubernetes-workload-pack/examples/
# high-assurance-workload/facts.ttl field-for-field (control-map.md's
# WORKLOAD_CONTROL rows SEC-POD-001/002/003, SEC-CTR-001/002/003,
# SEC-RES-001, SEC-AVAIL-001, SEC-ID-001/002), applied to this real
# distributed-Erlang swarm-test workload instead of that example's
# illustrative ledger-reconciliation payload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ash-a2a-swarm
  namespace: ash-a2a-swarm
  labels:
    app: ash-a2a-swarm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ash-a2a-swarm
  template:
    metadata:
      labels:
        app: ash-a2a-swarm
    spec:
      serviceAccountName: ash-a2a-swarm
      # SEC-ID-002: libcluster's Kubernetes.DNS strategy talks to plain
      # DNS, never the Kubernetes API server -- no token is ever needed.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: swarm-node
          # --- Digest-pinning readiness (PREP ONLY -- not yet executed) ---
          # The `image:` value below is a clearly-marked PLACEHOLDER, not
          # a real registry digest. Digest-pinning (SEC-IMG-001 in
          # docs/ENTERPRISE_READINESS_REPORT.md; SEC-COSIGN-001 in
          # ~/ggen-marketplace/packs/kubernetes-workload-pack's
          # control-map.md) is NOT done -- this workload has never been
          # pushed to a real registry this session, so there is no real
          # digest to pin to and no real image for `cosign` to verify.
          # See k8s/README.md's "Digest-pinning readiness (prep only)"
          # section for the full recipe and rationale. Exact real
          # command sequence to close this for real, in a later session:
          #   1. docker run -d --restart=always -p 5000:5000 \
          #        --name ash-a2a-local-registry registry:2
          #   2. docker tag ash-a2a-swarm-node:local \
          #        localhost:5000/ash-a2a-swarm-node:local
          #   3. docker push localhost:5000/ash-a2a-swarm-node:local
          #   4. docker inspect --format='{{index .RepoDigests 0}}' \
          #        localhost:5000/ash-a2a-swarm-node:local
          #      (capture the real sha256:<digest> this prints)
          #   5. cosign generate-key-pair   # once; never commit cosign.key
          #   6. cosign sign --key cosign.key \
          #        localhost:5000/ash-a2a-swarm-node@sha256:<REAL_DIGEST>
          #   7. cosign verify --key cosign.pub \
          #        localhost:5000/ash-a2a-swarm-node@sha256:<REAL_DIGEST>
          #   8. Replace the `image:` line below with:
          #        image: localhost:5000/ash-a2a-swarm-node@sha256:<REAL_DIGEST>
          #      then:
          #        kind load docker-image \
          #          localhost:5000/ash-a2a-swarm-node@sha256:<REAL_DIGEST> \
          #          --name ash-a2a-swarm
          #      (imagePullPolicy stays Never -- see comment below; this
          #      avoids wiring a containerd registry-mirror into every
          #      kind node just for this ephemeral test workload.)
          image: ash-a2a-swarm-node:local  # PLACEHOLDER -- unpinned, real digest not yet substituted
          # Never (not IfNotPresent, which can still silently reach for a
          # registry on a cache miss): real air-gap/offline-provenance
          # test (NIST SP 800-53 SA-9, external system services) --
          # proves this workload schedules from a kind-loaded local image
          # alone, with the kubelet never attempting any registry pull.
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: epmd
              containerPort: 4369
            - name: dist
              containerPort: 9000
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_DISTRIBUTION
              value: "name"
            - name: RELEASE_NODE
              value: "swarm_node@$(POD_IP)"
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: ash-a2a-swarm-cookie
                  key: cookie
            - name: RELEASE_TMP
              value: "/tmp"
            - name: SWARM_K8S_SERVICE
              value: "ash-a2a-swarm-headless"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          # readOnlyRootFilesystem: true (above) needs a real writable
          # location for the release's own runtime tmp dir (RELEASE_TMP)
          # and Erlang's default tmp usage -- an ephemeral emptyDir, not a
          # persistent volume, since nothing here needs to survive a pod
          # restart.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
