# Headless Service (spec.clusterIP: None) -- the StatefulSet's governing
# Service (deployment.yaml `serviceName`) and the DNS source for libcluster.
# It gives every replica a stable DNS name
# (<pod>.ash-a2a-swarm-headless.<ns>.svc.cluster.local, used as the BEAM node
# host) and SRV records for Cluster.Strategy.Kubernetes.DNSSRV.
#
# publishNotReadyAddresses: true -- peers must be able to discover and
# connect to each other BEFORE they are Ready, because readiness itself
# requires SWARM_MIN_PEERS connected peers (and EKV quorum). Without it the
# cluster could never form. This Service carries no client traffic, so
# publishing not-ready pods here does not route requests to them; client
# traffic goes through ash-a2a-swarm-http, which only lists Ready pods.
apiVersion: v1
kind: Service
metadata:
  name: ash-a2a-swarm-headless
  namespace: ash-a2a-swarm
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: ash-a2a-swarm
  ports:
    # EPMD (Erlang Port Mapper Daemon), standard 4369.
    - name: epmd
      port: 4369
      targetPort: 4369
    # Distribution itself uses the fixed inet_dist port 9000 set in
    # swarm/rel/vm.args.eex (-kernel inet_dist_listen_min/max 9000), over
    # TLS (swarm/rel/env.sh.eex). Pod-to-pod TCP; listed for documentation
    # and NetworkPolicy parity, not proxied.
    - name: dist
      port: 9000
      targetPort: 9000
