# SEC-ID-001 (control-map.md): dedicated ServiceAccount, no default-SA
# reliance. Deliberately granted zero RBAC (no Role/RoleBinding bound to
# it): libcluster's Cluster.Strategy.Kubernetes.DNS strategy discovers
# peers via plain DNS against the headless Service, never the Kubernetes
# API server -- this workload needs no API access at all, so
# automountServiceAccountToken: false (deployment.yaml, SEC-ID-002) is a
# real, correct hardening, not a feature this workload silently loses.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ash-a2a-swarm
  namespace: ash-a2a-swarm
